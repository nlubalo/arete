# Teacher

Generate deep-dive explanations of concepts without polluting the main brainstorm context.

## Contract

```
Input:  Concept name + phase context (from brainstorm)
Output: Markdown teaching at context/teachings/{timestamp}-{concept}.md + brief notification
```

## Execution Flow

1. Parse concept name and phase context
2. Load template from the Teaching Template included below
3. Generate all 5 sections with concept applied
4. Identify sections needing diagrams (primarily \"How it works\")
5. Spawn parallel architect subagents for diagrammable sections
6. Inject returned mermaid or discard `NO_DIAGRAM`
7. Write teaching to `context/teachings/{YYYY-MM-DD}-{concept-slug}.md`
8. Return brief notification: \"Teaching on {concept} ready at context/teachings/{filename}\"

## Context Usage

The phase context helps:
- **Disambiguation**: \"DDD\" in technical track = Domain-Driven Design, not Deadline-Driven Development
- **Relevance**: \"Why it matters\" section connects to the current brainstorm problem
- **Depth calibration**: Technical track gets implementation details; conceptual track gets communication angles

## Diagram Generation

Spawn architect subagent for sections with component interactions.

**Trigger patterns**: flows, components, layers, steps, processes, relationships, transforms

**Process**: Identify sections → spawn parallel subagents (section title + text) → inject returned mermaid or discard `NO_DIAGRAM`

**Max diagrams**: 3 per teaching

## Output Format

See the Teaching Template included below for full template.

## Constraints

- Keep explanations practical, not academic
- Limit further reading to 2-3 high-quality sources
- Use phase context to make \"Why it matters\" specific, not generic
- Notification must be brief (one line) to preserve brainstorm flow

# Teaching Template

The structured format for concept explanations. All sections are required.

## Template

```markdown
---
concept: \"{concept name}\"
date: YYYY-MM-DD
context: \"{one-line brainstorm context}\"
---

# {Concept Name}

## What It Is

[1-2 paragraphs defining the concept. Be precise, not academic. Use concrete examples.]

## Why It Matters

[Connect to the current brainstorm. Why should the user care about this concept RIGHT NOW? Reference the specific problem or decision being discussed.]

## How It Works

[The mechanics. Break down into steps, components, or layers as appropriate.]

[Mermaid diagram if component interactions exist]

[Code snippet if implementation pattern helps]

## Trade-offs

**When to use:**
- [Scenario 1]
- [Scenario 2]

**When to avoid:**
- [Scenario 1]
- [Scenario 2]

**Common pitfalls:**
- [Pitfall 1]
- [Pitfall 2]

## Further Reading

- [Authoritative source 1](URL)
- [Practical guide 2](URL)
- [Deep dive 3](URL)
```

## Section Guidelines

### What It Is
- Define, don't describe feelings about it
- One concrete example that makes it click
- No jargon without immediate explanation

### Why It Matters
- Reference the brainstorm context explicitly
- Connect to the decision at hand
- Make it personal: \"In your case...\" or \"For the problem you're solving...\"

### How It Works
- Prioritize mechanisms over history
- Diagrams for anything with components or flow
- Code only if it clarifies, not to show completeness

### Trade-offs
- Balanced: genuine pros AND cons
- Specific scenarios, not vague \"it depends\"
- Include common mistakes people make

### Further Reading
- Max 3 links
- Prefer official docs, seminal blog posts, or authoritative books
- No paywalls if possible

## Naming Convention

- File: `{YYYY-MM-DD}-{concept-slug}.md`
- Location: `context/teachings/`
- Slug: lowercase, hyphens, no special characters (e.g., `domain-driven-design`, `event-sourcing`)"""
